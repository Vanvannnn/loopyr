<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="titre">
  <title id="titre">Loop R</title>
  <!-- Le R seul : la boucle qui revient à son point de départ, et la jambe qui s'élance. -->
  <style>
    .boucle { fill: none; stroke: var(--loopr-boucle, #2443E6); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .depart { fill: var(--loopr-signal, #C8F031); stroke: var(--loopr-anneau, #0D1726); stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) { .boucle { stroke: var(--loopr-boucle, #6380FF); } }
  </style>
  <path class="boucle" transform="translate(5.5 0) skewX(-10)"
        d="M14 39V9H20C27 9 30 13.5 30 17.5C30 22.5 26.5 26 20 26H14M20.5 26L31 39"/>
  <circle class="depart" cx="14.92" cy="26" r="4.4"/>
</svg>
