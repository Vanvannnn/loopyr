<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/img/app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loopy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A16" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/css/loopy.css">
</head>
<body>
<header class="entete">
  <div class="conteneur">
    <a class="marque" href="/" aria-label="Loopy, accueil">
      <img class="clair" src="/assets/img/loopy-horizontal-couleur-clair.svg" alt="Loopy" width="69" height="34">
      <img class="sombre" src="/assets/img/loopy-horizontal-sombre.svg" alt="Loopy" width="69" height="34">
    </a>
    <nav class="nav" aria-label="Principale">
      <a href="/creer.html">Créer<span class="large"> une boucle</span></a>
      <a class="large" href="/communaute.html">Communauté</a>
      <a href="/strava.html">Strava</a>
      <a class="bouton signal telecharger" href="/telecharger.html">Télécharger<span class="large">&nbsp;l'appli</span></a>
      <a href="/connexion.html" data-compte>Se connecter</a>
    </nav>
  </div>
</header>

<main class="page-etroite">
  <h1>Nouveau mot de passe</h1>
  <p class="doux">Choisis-le, puis connecte-toi avec. Tu seras déconnecté de tes autres appareils.</p>
  <form novalidate>
    <div class="champ"><label for="mdp">Nouveau mot de passe</label><input id="mdp" name="mdp" type="password" autocomplete="new-password" required minlength="8">
      <p class="aide">8 caractères au moins.</p></div>
    <p id="msg" class="message" role="alert" hidden></p>
    <div class="rangee" style="margin-top:20px"><button class="bouton" type="submit">Changer le mot de passe</button></div>
  </form>
</main>
<script type="module">
import { api } from "/assets/js/commun.js";
const f = document.querySelector("form"), msg = document.getElementById("msg");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = f.querySelector("button[type=submit]");
  b.disabled = true; msg.hidden = true;
  try {
    const r = await api("/api/mot-de-passe/reinit", { methode: "POST", corps: { jeton: location.hash.slice(1), mot_de_passe: f.mdp.value } });
    msg.className = "message"; msg.innerHTML = `${r.message}. <a href="/connexion.html">Se connecter</a>`; msg.hidden = false;
  } catch (err) {
    msg.className = "message erreur"; msg.textContent = err.message; msg.hidden = false;
  } finally { b.disabled = false; }
});
</script>
</body>
</html>
