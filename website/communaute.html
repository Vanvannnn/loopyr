<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communauté</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/img/app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loopy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A16" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/assets/css/loopy.css">
<style>
  .titre-page { padding: 40px 0 24px; }
  .titre-page h1 { font-size: clamp(2.6rem, 7vw, 4.4rem); margin-bottom: 12px; }
  .mosaique { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px 24px; }
  .tuile .apercu { aspect-ratio: 4 / 3; background: var(--fond-2); border-radius: var(--r); }
  .tuile .apercu svg { width: 100%; height: 100%; padding: 12%; }
  .tuile h3 { font-size: 1.35rem; margin: 12px 0 4px; }
  .tuile .chiffres { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: .95rem; }
  .section-titre { font-size: 2rem; margin: 40px 0 18px; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--sauge); object-fit: cover; display: grid; place-items: center;
    font: 800 2.4rem/1 var(--chiffres); color: #22322B; flex-shrink: 0; }
  .personne { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .personne .avatar { width: 44px; height: 44px; font-size: 1.3rem; }
</style>
</head>
<body>
<header class="entete">
  <div class="conteneur">
    <a class="marque" href="/" aria-label="Loopy, accueil">
      <img class="clair" src="/assets/img/loopy-horizontal-couleur-clair.svg" alt="Loopy" width="69" height="34">
      <img class="sombre" src="/assets/img/loopy-horizontal-sombre.svg" alt="Loopy" width="69" height="34">
    </a>
    <nav class="nav" aria-label="Principale">
      <a href="/creer.html">Créer<span class="large"> une boucle</span></a>
      <a class="large" href="/communaute.html" aria-current="page">Communauté</a>
      <a href="/strava.html">Strava</a>
      <a class="bouton signal telecharger" href="/telecharger.html">Télécharger<span class="large">&nbsp;l'appli</span></a>
      <a href="/connexion.html" data-compte>Se connecter</a>
    </nav>
  </div>
</header>
<main class="conteneur">
  <div class="titre-page"><h1>Communauté</h1><p class="doux">Les boucles partagées et les sorties publiques. Les départs sont masqués quand leur auteur l'a choisi.</p></div>
  <form class="rangee" id="recherche" role="search" style="max-width:520px">
    <label class="cache" for="q">Chercher un sportif</label>
    <input id="q" type="search" placeholder="Chercher un sportif par son nom" style="flex:1" autocomplete="off">
    <button class="bouton second" type="submit">Chercher</button>
  </form>
  <div id="personnes" style="margin-top:16px"></div>
  <div class="rangee" style="margin-top:32px"><div class="segmente" role="group" aria-label="Sport">
    <button type="button" data-s="" aria-pressed="true">Tous</button><button type="button" data-s="course" aria-pressed="false">Course</button><button type="button" data-s="velo" aria-pressed="false">Vélo</button></div></div>
  <h2 class="section-titre">Boucles partagées</h2><div class="mosaique" id="parcours"></div>
  <h2 class="section-titre">Sorties récentes</h2><div class="mosaique" id="activites"></div>
</main>
<footer class="pied"><div class="conteneur"><p>Données cartographiques © les contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.</p></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { api, echapper } from "/assets/js/commun.js";
import { tuileActivite, tuileItineraire, avatar } from "/assets/js/apercu.js";
const $ = (s) => document.querySelector(s);
let sport = "";
async function charger() {
  const [its, acts] = await Promise.all([api(`/api/communaute/itineraires${sport ? "?sport=" + sport : ""}`), api("/api/communaute/activites")]);
  $("#parcours").innerHTML = its.map(tuileItineraire).join("") || `<p class="vide">Aucune boucle partagée${sport ? " pour ce sport" : ""} pour l'instant. Partage les tiennes depuis ton espace.</p>`;
  const as = acts.filter((a) => !sport || a.sport === sport);
  $("#activites").innerHTML = as.map(tuileActivite).join("") || `<p class="vide">Aucune sortie publique pour l'instant.</p>`;
}
document.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => {
  sport = b.dataset.s; document.querySelectorAll("[data-s]").forEach((x) => x.setAttribute("aria-pressed", x === b)); charger();
}));
$("#recherche").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await api(`/api/utilisateurs?q=${encodeURIComponent($("#q").value)}`).catch(() => []);
  $("#personnes").innerHTML = r.length ? `<div class="rangee">${r.map((x) => `<a class="personne" href="/u.html?nom=${encodeURIComponent(x.nom)}">${avatar(x)}<strong>${echapper(x.nom)}</strong></a>`).join("")}</div>`
    : `<p class="doux">Personne ne correspond (2 lettres au moins).</p>`;
});
charger().catch((e) => { $("#parcours").innerHTML = `<p class="message erreur">${echapper(e.message)}</p>`; });
</script>
</body>
</html>
