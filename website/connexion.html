<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/img/app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loopy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A16" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/css/loopy.css">
</head>
<body>
<header class="entete">
  <div class="conteneur">
    <a class="marque" href="/" aria-label="Loopy, accueil">
      <img class="clair" src="/assets/img/loopy-horizontal-couleur-clair.svg" alt="Loopy" width="69" height="34">
      <img class="sombre" src="/assets/img/loopy-horizontal-sombre.svg" alt="Loopy" width="69" height="34">
    </a>
    <nav class="nav" aria-label="Principale">
      <a href="/creer.html">Créer<span class="large"> une boucle</span></a>
      <a class="large" href="/communaute.html">Communauté</a>
      <a href="/strava.html">Strava</a>
      <a class="bouton signal telecharger" href="/telecharger.html">Télécharger<span class="large">&nbsp;l'appli</span></a>
      <a href="/connexion.html" data-compte>Se connecter</a>
    </nav>
  </div>
</header>

<main class="page-etroite">
  <h1>Se connecter</h1>
  <p class="doux">Le même compte que dans l'app Loopy.</p>
  <form novalidate>
    <div class="champ"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="champ"><label for="mdp">Mot de passe</label><input id="mdp" name="mdp" type="password" autocomplete="current-password" required>
      <p class="aide"><a href="/mot-de-passe.html">Mot de passe oublié</a></p></div>
    <p id="msg" class="message" role="alert" hidden></p>
    <div class="rangee" style="margin-top:20px"><button class="bouton" type="submit">Se connecter</button>
      <a class="bouton discret" href="/inscription.html">Créer un compte</a></div>
  </form>
</main>
<script type="module">
import { api } from "/assets/js/commun.js";
const f = document.querySelector("form"), msg = document.getElementById("msg");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = f.querySelector("button[type=submit]");
  b.disabled = true; msg.hidden = true;
  try {
    await api("/api/sessions", { methode: "POST", corps: { email: f.email.value, mot_de_passe: f.mdp.value } });
    const suite = new URLSearchParams(location.search).get("suite");
    location.replace(suite && suite.startsWith("/") && !suite.startsWith("//") ? suite : "/espace.html");
  } catch (err) {
    msg.className = "message erreur"; msg.textContent = err.message; msg.hidden = false;
  } finally { b.disabled = false; }
});
</script>
</body>
</html>
